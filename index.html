<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Science World — Shop</title>
<link rel="icon" href="logo.png" onerror="this.href=''" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Dancing+Script:wght@600;700&family=Poppins:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --bg:#FDF3EA; --bg-glow:#FFFCF3; --card:rgba(255,253,246,.55); --card-2:rgba(255,253,246,.75);
    --navy:#0A0E1A; --navy-light:#1A2440;
    --ink:#2A1B33; --ink-soft:#7A5E7A; --ink-dark:#1B1408;
    --gold:#C9781E; --gold-soft:#E8A23A; --gold-deep:#9A5A12;
    --green:#0E8A5C; --amber:#D6641F;
    --line:rgba(201,80,150,.22); --red:#D42B5C; --cream:rgba(255,253,246,.85);
    --sapphire:#2B4FA8; --ruby:#D42B5C; --emerald:#0E8A5C; --violet:#7A3AC9; --pink:#E5497C;
    --glass-blur:18px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      radial-gradient(1000px 480px at 12% -6%, rgba(169,130,46,.20), transparent 60%),
      radial-gradient(820px 460px at 100% 4%, rgba(14,107,75,.14), transparent 55%),
      radial-gradient(760px 520px at 50% 100%, rgba(156,43,61,.10), transparent 55%),
      radial-gradient(600px 400px at 90% 60%, rgba(29,62,110,.09), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:'Poppins',sans-serif; font-weight:500; color:var(--ink); min-height:100vh;
  }
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer; border:none; background:none;}
  input,select,textarea{font-family:'Poppins',sans-serif; font-weight:500; font-size:14px; color:var(--ink); background:var(--card-2); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);}
  ::placeholder{color:var(--ink-soft);}
  ::-webkit-scrollbar{height:6px;width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--gold-deep); border-radius:4px;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .disp{font-family:'Playfair Display',serif; font-weight:800; letter-spacing:.01em;}
  .script{font-family:'Dancing Script',cursive; font-weight:700;}
  .hidden{display:none !important;}
  .gold-text{background:linear-gradient(90deg, var(--gold-soft), var(--pink), var(--violet)); -webkit-background-clip:text; background-clip:text; color:transparent;}

  /* ---------- Loading screen ---------- */
  #loading-screen{
    position:fixed; inset:0; z-index:999;
    background:
      radial-gradient(700px 400px at 50% 40%, rgba(169,130,46,.22), transparent 65%),
      linear-gradient(180deg, #FFFCF3, #F3ECDA);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;
    transition:opacity .5s ease, visibility .5s ease;
  }
  #loading-screen.fade-out{opacity:0; visibility:hidden; pointer-events:none;}
  #loading-screen img, #loading-screen .logo-fallback{
    width:88px; height:88px; object-fit:contain; animation:pulse 1.8s ease-in-out infinite;
    border-radius:50%; box-shadow:0 0 0 1.5px var(--gold), 0 0 32px 6px rgba(212,175,55,.35);
  }
  .logo-fallback{
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, var(--gold-soft), var(--gold-deep)); border-radius:50%; font-size:32px;
  }
  @keyframes pulse{0%,100%{transform:scale(1); box-shadow:0 0 0 1.5px var(--gold), 0 0 24px 4px rgba(212,175,55,.28);}50%{transform:scale(1.05); box-shadow:0 0 0 1.5px var(--gold-soft), 0 0 40px 10px rgba(212,175,55,.4);}}
  #loading-text{font-family:'IBM Plex Mono',monospace; color:var(--gold-soft); font-size:13px; min-height:18px; letter-spacing:.03em;}
  #loading-text::after{content:'▍'; animation:blink 0.8s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}

  /* ---------- Header ---------- */
  header{
    position:sticky; top:0; z-index:30;
    background:rgba(255,253,246,.62); backdrop-filter:blur(var(--glass-blur)) saturate(160%); -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(160%);
    border-bottom:1px solid var(--gold);
    box-shadow:0 1px 0 rgba(255,255,255,.7), 0 10px 26px -18px rgba(124,90,30,.5);
    display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px;
    padding:13px 20px;
  }
  .brand{display:flex; align-items:center; gap:10px; cursor:pointer;}
  .brand img, .brand .logo-fallback{width:34px; height:34px; border-radius:9px; box-shadow:0 0 0 1px rgba(212,175,55,.5);}
  .brand .logo-fallback{background:linear-gradient(135deg,var(--gold-soft),var(--gold-deep)); display:flex; align-items:center; justify-content:center; font-size:16px;}
  .brand span{font-family:'Dancing Script',cursive; font-weight:700; font-size:26px; background:linear-gradient(90deg, var(--gold), var(--pink), var(--violet)); -webkit-background-clip:text; background-clip:text; color:transparent; letter-spacing:.01em;}
  .searchbox{display:flex; align-items:center; gap:8px; flex:1; max-width:420px; background:var(--card-2); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid var(--line); border-radius:10px; padding:9px 13px;}
  .searchbox input{border:none; outline:none; flex:1; font-size:13px; background:transparent; color:var(--ink-dark);}
  .cart-btn{position:relative; display:flex; align-items:center; gap:6px; background:var(--card-2); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid var(--line); color:var(--ink); border-radius:10px; padding:9px 14px; font-size:13px; font-weight:500; transition:.15s;}
  .cart-btn:hover{border-color:var(--gold);}
  .badge{position:absolute; top:-7px; right:-7px; background:linear-gradient(135deg,var(--gold-soft),var(--gold)); color:var(--ink-dark); font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:10px; width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center;}
  .myorders-link{color:var(--ink-soft); font-size:12.5px; transition:.15s;}
  .myorders-link:hover{color:var(--gold-soft);}

  /* ---------- Hero ---------- */
  .hero{max-width:1100px; margin:0 auto; padding:48px 20px 24px; display:flex; flex-wrap:wrap; gap:28px; align-items:center;}
  .hero-left{flex:1; min-width:260px; display:flex; flex-direction:column; gap:14px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em; color:var(--gold-soft); text-transform:uppercase; display:flex; align-items:center; gap:7px;}
  .eyebrow::before{content:''; width:22px; height:1px; background:linear-gradient(90deg, var(--gold), transparent);}
  .hero h1{font-size:clamp(28px,5vw,46px); line-height:1.14; color:var(--ink);}
  .hero h1 em{font-style:normal; font-family:'Dancing Script',cursive; font-weight:700; background:linear-gradient(90deg, var(--gold), var(--pink), var(--violet)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .hero p{font-size:14.5px; color:var(--ink-soft); max-width:440px; line-height:1.6;}
  .hero-shapes{position:relative; width:210px; height:190px; flex-shrink:0; margin:0 auto;}
  .shape{position:absolute; border-radius:18px; display:flex; align-items:center; justify-content:center; font-size:34px; color:#fff; border:1px solid rgba(255,255,255,.4); box-shadow:0 10px 26px -10px rgba(36,26,14,.35);}

  /* ---------- Category strip ---------- */
  .cat-strip{max-width:1100px; margin:0 auto; padding:0 20px; display:flex; gap:11px; overflow-x:auto; padding-bottom:14px;}
  .cat-tile{flex-shrink:0; width:92px; height:90px; border-radius:13px; border:1.5px solid var(--line); background:var(--card); backdrop-filter:blur(var(--glass-blur)) saturate(160%); -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(160%); display:flex; flex-direction:column; justify-content:space-between; padding:9px 11px; transition:transform .15s, border-color .15s, box-shadow .15s;}
  .cat-tile:hover{transform:translateY(-3px); border-color:var(--gold); box-shadow:0 12px 26px -14px rgba(124,90,30,.45);}
  .cat-tile.active{color:var(--ink-dark); box-shadow:0 10px 24px -8px rgba(124,90,30,.5), inset 0 1px 0 rgba(255,255,255,.4);}
  .cat-tile .top-row{display:flex; justify-content:space-between; align-items:center; font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-soft);}
  .cat-tile.active .top-row{color:rgba(20,20,20,.65);}
  .cat-tile .symbol{font-family:'Playfair Display',serif; font-weight:700; font-size:21px;}
  .cat-tile .cname{font-size:10px; margin-top:2px; color:var(--ink-soft);}
  .cat-tile.active .cname{color:rgba(20,20,20,.75);}

  /* ---------- Product grid ---------- */
  .section-wrap{max-width:1100px; margin:0 auto; padding:24px 20px 44px;}
  .section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .section-head h2{font-size:20px;}
  .product-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:18px;}
  .p-card{background:var(--card); backdrop-filter:blur(var(--glass-blur)) saturate(160%); -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(160%); border:1px solid var(--line); border-radius:13px; overflow:hidden; display:flex; flex-direction:column; transition:transform .18s, box-shadow .18s, border-color .18s;}
  .p-card:hover{transform:translateY(-4px); border-color:var(--gold); box-shadow:0 18px 36px -16px rgba(124,90,30,.4), inset 0 1px 0 rgba(255,255,255,.5);}
  .p-thumb{height:132px; display:flex; align-items:center; justify-content:center; position:relative; cursor:pointer; overflow:hidden; background:var(--card-2);}
  .p-thumb img{width:100%; height:100%; object-fit:cover;}
  .p-badge{position:absolute; top:8px; left:8px; background:linear-gradient(135deg,var(--violet),var(--pink)); color:#fff; font-size:9px; font-weight:700; text-transform:uppercase; font-family:'IBM Plex Mono',monospace; padding:3px 9px; border-radius:20px;}
  .p-body{padding:13px; display:flex; flex-direction:column; gap:7px; flex:1;}
  .p-title{font-size:13px; font-weight:500; line-height:1.35; min-height:34px; cursor:pointer; color:var(--ink);}
  .p-price-row{display:flex; align-items:baseline; gap:6px;}
  .p-price{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:16px; color:var(--gold-soft);}
  .p-mrp{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); text-decoration:line-through;}
  .p-off{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--green);}
  .btn{border-radius:10px; padding:10px; font-weight:600; font-size:13px; text-align:center; transition:transform .15s, box-shadow .15s, background .15s;}
  .btn-navy{background:linear-gradient(135deg, var(--gold-soft), var(--gold)); color:var(--ink-dark); box-shadow:inset 0 1px 0 rgba(255,255,255,.45), 0 6px 16px rgba(124,90,30,.35);}
  .btn-navy:hover{transform:translateY(-1px); box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 10px 26px rgba(124,90,30,.45);}
  .btn-green{background:var(--green); color:#fff;}
  .btn-green:hover{transform:translateY(-1px); box-shadow:0 8px 18px rgba(31,176,122,.35);}
  .btn-amber{background:var(--amber); color:#fff;}
  .btn-outline{background:rgba(255,253,246,.4); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border:1.5px solid var(--line); color:var(--ink);}
  .btn-outline:hover{border-color:var(--gold);}
  .btn-red{background:var(--red); color:#fff;}
  .qty-row{display:flex; align-items:center; justify-content:space-between; border:1.5px solid var(--gold-deep); border-radius:10px; overflow:hidden; background:var(--card-2);}
  .qty-row button{width:34px; padding:8px 0; color:var(--gold-soft);}
  .qty-row span{font-family:'IBM Plex Mono',monospace; font-weight:600; color:var(--ink);}

  /* ---------- Product detail ---------- */
  .pd-wrap{max-width:1000px; margin:0 auto; padding:26px 20px 54px; display:flex; flex-wrap:wrap; gap:32px;}
  .pd-gallery{flex:1; min-width:280px;}
  .pd-main-img{width:100%; height:340px; border-radius:15px; overflow:hidden; background:var(--card); backdrop-filter:blur(var(--glass-blur)) saturate(160%); -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(160%); border:1px solid var(--line); display:flex; align-items:center; justify-content:center;}
  .pd-main-img img{width:100%; height:100%; object-fit:cover;}
  .pd-thumbs{display:flex; gap:8px; margin-top:11px; overflow-x:auto;}
  .pd-thumbs img{width:58px; height:58px; object-fit:cover; border-radius:8px; border:2px solid transparent; cursor:pointer; flex-shrink:0; opacity:.6; transition:.15s;}
  .pd-thumbs img.active{border-color:var(--gold); opacity:1;}
  .pd-info{flex:1; min-width:280px; display:flex; flex-direction:column; gap:13px;}
  .pd-info h1{font-size:23px; line-height:1.28; color:var(--ink);}
  .pd-desc{font-size:13.5px; color:var(--ink-soft); white-space:pre-wrap; line-height:1.7;}
  .back-link{font-size:12.5px; color:var(--ink-soft); display:inline-flex; align-items:center; gap:4px; margin-bottom:6px;}
  .back-link:hover{color:var(--gold-soft);}

  /* ---------- Cart drawer ---------- */
  #cart-overlay{position:fixed; inset:0; background:rgba(36,26,14,.35); backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px); z-index:40; opacity:0; pointer-events:none; transition:opacity .3s;}
  #cart-overlay.open{opacity:1; pointer-events:auto;}
  #cart-drawer{position:fixed; top:0; right:0; height:100%; width:380px; max-width:92vw; background:rgba(255,253,246,.68); backdrop-filter:blur(var(--glass-blur)) saturate(160%); -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(160%); border-left:1px solid var(--gold); z-index:50; display:flex; flex-direction:column; transform:translateX(100%); transition:transform .3s; box-shadow:-24px 0 60px -14px rgba(36,26,14,.35);}
  #cart-drawer.open{transform:translateX(0);}
  .drawer-head{display:flex; align-items:center; justify-content:space-between; padding:15px 18px; border-bottom:1px solid var(--line);}
  .drawer-head button{color:var(--ink-soft);}
  .cart-items{flex:1; overflow-y:auto; padding:12px 16px; display:flex; flex-direction:column; gap:12px;}
  .cart-item{display:flex; gap:10px; align-items:center;}
  .cart-item img{width:48px; height:48px; border-radius:8px; object-fit:cover; flex-shrink:0; background:var(--bg);}
  .cart-item .ci-info{flex:1; min-width:0;}
  .cart-item .ci-info p{font-size:12.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .cart-item .ci-info small{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-soft);}
  .drawer-foot{padding:14px 16px; border-top:1px solid var(--line);}
  .empty-state{display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:8px; text-align:center; padding:30px; color:var(--ink-soft); font-size:13px;}

  /* ---------- Checkout ---------- */
  .checkout-wrap{max-width:640px; margin:0 auto; padding:26px 20px 64px;}
  .co-summary{background:var(--card); backdrop-filter:blur(var(--glass-blur)) saturate(160%); -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(160%); border:1px solid var(--line); border-radius:13px; padding:15px; margin-bottom:22px;}
  .co-summary-row{display:flex; justify-content:space-between; font-size:13px; padding:4px 0; color:var(--ink);}
  .co-options{display:flex; gap:14px; margin-bottom:22px;}
  .co-option{flex:1; border:1.5px solid var(--line); border-radius:13px; padding:18px; text-align:center; background:var(--card); backdrop-filter:blur(var(--glass-blur)) saturate(160%); -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(160%); transition:.18s; color:var(--ink);}
  .co-option:hover{border-color:var(--gold);}
  .co-option.selected{border-color:var(--gold); box-shadow:0 0 0 1.5px var(--gold) inset, 0 10px 24px -10px rgba(124,90,30,.4);}
  .co-option h3{font-size:14.5px; margin-bottom:4px; font-family:'Playfair Display',serif;}
  .co-option p{font-size:11.5px; color:var(--ink-soft);}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .field{display:flex; flex-direction:column; gap:5px; margin-bottom:12px;}
  .field label{font-size:12px; color:var(--ink-soft);}
  .field input, .field select, .field textarea{padding:10px 12px; border:1.5px solid var(--line); border-radius:9px; outline:none; background:var(--card-2);}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--gold);}
  .pay-methods{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
  .pay-methods label{flex:1; min-width:100px; border:1.5px solid var(--line); border-radius:10px; padding:11px; text-align:center; font-size:12.5px; cursor:pointer; background:var(--card-2); color:var(--ink-soft); transition:.15s;}
  .pay-methods input{display:none;}
  .pay-methods input:checked + span{color:var(--gold-soft); font-weight:600;}
  .pay-methods label:has(input:checked){border-color:var(--gold);}
  .coupon-row{display:flex; gap:8px; margin-bottom:10px;}
  .coupon-row input{flex:1;}
  .info-card{background:rgba(31,176,122,.08); border:1px solid var(--green); border-radius:11px; padding:13px 15px; font-size:12.5px; display:flex; flex-direction:column; gap:5px; margin:10px 0; color:var(--ink);}
  .info-card a{color:var(--green); font-weight:600;}
  .success-box{background:var(--card); backdrop-filter:blur(var(--glass-blur)) saturate(160%); -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(160%); border:1px solid var(--line); border-radius:15px; padding:34px 22px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:11px;}
  .success-icon{width:58px; height:58px; border-radius:50%; background:linear-gradient(135deg,var(--emerald),var(--sapphire)); display:flex; align-items:center; justify-content:center; font-size:28px; color:#fff; box-shadow:0 0 30px rgba(14,138,92,.4);}
  .status-pill{font-family:'IBM Plex Mono',monospace; font-size:10.5px; padding:4px 11px; border-radius:20px; text-transform:uppercase;}
  .status-pending{background:rgba(201,117,43,.14); color:#A05A1E;}
  .status-delivered{background:rgba(18,138,97,.14); color:#0E7A54;}
  .status-cancelled{background:rgba(212,43,92,.14); color:#B01F4E;}

  /* ---------- My orders ---------- */
  .order-card{background:var(--card); backdrop-filter:blur(var(--glass-blur)) saturate(160%); -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(160%); border:1px solid var(--line); border-radius:13px; padding:15px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;}
  .order-card .oc-left{display:flex; flex-direction:column; gap:3px;}
  .order-card .oc-left p{font-size:13px; font-weight:500; color:var(--ink);}
  .order-card .oc-left small{color:var(--ink-soft); font-size:11.5px; font-family:'IBM Plex Mono',monospace;}

  /* ---------- Modal ---------- */
  .modal-overlay{position:fixed; inset:0; background:rgba(36,26,14,.45); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); z-index:70; display:flex; align-items:center; justify-content:center; padding:16px;}
  .modal-box{background:rgba(255,253,246,.82); backdrop-filter:blur(var(--glass-blur)) saturate(160%); -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(160%); border:1px solid var(--gold); border-radius:15px; padding:26px; width:100%; max-width:400px; max-height:90vh; overflow-y:auto; box-shadow:0 30px 60px -20px rgba(36,26,14,.45), inset 0 1px 0 rgba(255,255,255,.5);}
  .modal-box.wide{max-width:640px;}
  .modal-box h2{font-size:18px; margin-bottom:18px; font-family:'Playfair Display',serif;}

  /* ---------- Admin ---------- */
  .admin-wrap{max-width:1100px; margin:0 auto; padding:22px 20px 64px;}
  .admin-tabs{display:flex; gap:8px; margin-bottom:22px; overflow-x:auto; padding-bottom:4px;}
  .admin-tab{flex-shrink:0; padding:9px 17px; border-radius:20px; font-size:12.5px; font-weight:500; background:var(--card); backdrop-filter:blur(var(--glass-blur)) saturate(160%); -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(160%); color:var(--ink-soft); border:1.5px solid var(--line);}
  .admin-tab.active{background:linear-gradient(135deg,var(--gold-soft),var(--gold)); color:var(--ink-dark); border-color:var(--gold); font-weight:700;}
  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:26px;}
  .stat-card{background:var(--card); backdrop-filter:blur(var(--glass-blur)) saturate(160%); -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(160%); border:1px solid var(--line); border-radius:13px; padding:17px;}
  .stat-card .num{font-family:'Playfair Display',serif; font-weight:700; font-size:27px; color:var(--gold-soft);}
  .stat-card .lbl{font-size:11.5px; color:var(--ink-soft);}
  table{width:100%; border-collapse:collapse; background:var(--card); backdrop-filter:blur(var(--glass-blur)) saturate(160%); -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(160%); border-radius:13px; overflow:hidden; font-size:12.5px; color:var(--ink);}
  th,td{padding:11px 13px; text-align:left; border-bottom:1px solid var(--line);}
  th{background:var(--card-2); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; color:var(--ink-soft); letter-spacing:.04em;}
  tr:hover td{background:rgba(169,130,46,.07);}
  .table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:13px;}
  .row-actions{display:flex; gap:6px;}
  .row-actions button{font-size:11px; padding:5px 9px; border-radius:6px;}

/* Firebase Storage ki jagah: image file ko resize+compress karke base64 data URL bana dete hain,
   taaki seedha Firestore document me store ho sake (koi storage bucket zaroori nahi). */
function fileToCompressedDataUrl(file, maxDim=900, quality=0.72){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(reader.error);
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('Image load failed'));
      img.onload = ()=>{
        let {width, height} = img;
        if(width > maxDim || height > maxDim){
          if(width >= height){ height = Math.round(height * (maxDim/width)); width = maxDim; }
          else{ width = Math.round(width * (maxDim/height)); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

  `;
}

function computeDiscount(coupon, subtotal){
  if(coupon.type === 'percent') return Math.round(subtotal * (coupon.value/100));
  return Math.min(coupon.value, subtotal);
}

/* =========================================================
   EVENT DELEGATION — CLICKS
========================================================= */
document.addEventListener('click', async (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;

  if(action==='nav-home'){ location.hash = '#/'; }
  else if(action==='set-category'){ state.activeCategory = el.dataset.id; render(); }
  else if(action==='open-product'){ location.hash = '#/product/'+encodeURIComponent(el.dataset.id); }
  else if(action==='set-pd-img'){ state.pdActiveImg = Number(el.dataset.idx); render(); }
  else if(action==='add-cart'){
    const p = state.products.find(x=>x.id===el.dataset.id);
    if(!p || !inStock(p)){ toast('Ye product abhi available nahi hai'); return; }
    if(p.quantity!=null && (state.cart[el.dataset.id]||0)+1 > p.quantity){ toast(`Sirf ${p.quantity} units available hain`); return; }
    state.cart[el.dataset.id] = (state.cart[el.dataset.id]||0)+1; saveCart(); toast('Added to cart'); render();
  }
  else if(action==='inc-cart'){
    const p = state.products.find(x=>x.id===el.dataset.id);
    if(p && p.quantity!=null && (state.cart[el.dataset.id]||0)+1 > p.quantity){ toast(`Sirf ${p.quantity} units available hain`); return; }
    state.cart[el.dataset.id] = (state.cart[el.dataset.id]||0)+1; saveCart(); render();
  }
  else if(action==='dec-cart'){
    const id = el.dataset.id;
    state.cart[id] = Math.max(0,(state.cart[id]||0)-1);
    if(state.cart[id]===0) delete state.cart[id];
    saveCart(); render();
  }
  else if(action==='open-cart'){ document.getElementById('cart-overlay').classList.add('open'); document.getElementById('cart-drawer').classList.add('open'); }
  else if(action==='close-cart'){ document.getElementById('cart-overlay').classList.remove('open'); document.getElementById('cart-drawer').classList.remove('open'); }
  else if(action==='set-checkout-type'){ state.checkoutType = el.dataset.type; state.appliedCoupon=null; render(); }
  else if(action==='apply-coupon'){ await handleApplyCoupon(); }
  else if(action==='remove-coupon'){ state.appliedCoupon=null; render(); }
  else if(action==='admin-icon'){ if(state.isAdmin){ location.hash='#/admin'; } else { openAdminLoginModal(); } }
  else if(action==='admin-logout'){ state.isAdmin=false; sessionStorage.removeItem('sw_admin'); location.hash='#/'; }
  else if(action==='admin-tab'){ state.adminTab = el.dataset.tab; render(); }
  else if(action==='close-modal'){ document.getElementById('modal-root').innerHTML=''; }
  else if(action==='open-category-form'){ openCategoryForm(null); }
  else if(action==='edit-category'){ openCategoryForm(state.categories.find(c=>c.id===el.dataset.id)); }
  else if(action==='delete-category'){ if(confirm('Category delete karein?')) await deleteDoc(doc(db,'categories',el.dataset.id)); }
  else if(action==='open-product-form'){ openProductForm(null); }
  else if(action==='edit-product'){ openProductForm(state.products.find(p=>p.id===el.dataset.id)); }
  else if(action==='delete-product'){ if(confirm('Product delete karein?')) await deleteDoc(doc(db,'products',el.dataset.id)); }
  else if(action==='open-coupon-form'){ openCouponForm(); }
  else if(action==='delete-coupon'){ if(confirm('Coupon delete karein?')) await deleteDoc(doc(db,'coupons',el.dataset.id)); }
  else if(action==='toggle-coupon'){
    const c = state.coupons.find(x=>x.id===el.dataset.id);
    await updateDoc(doc(db,'coupons',el.dataset.id), {active: !c.active});
  }
});

document.getElementById('modal-root').addEventListener('click', (e)=>{
  if(e.target.id==='modal-root') document.getElementById('modal-root').innerHTML='';
});

document.addEventListener('change', async (e)=>{
  if(e.target.dataset.action==='set-order-status'){
    const sel = e.target;
    const prevValue = sel.dataset.current || 'pending';
    try{
      await updateDoc(doc(db,'orders', sel.dataset.id), {status: sel.value});
      sel.dataset.current = sel.value;
      toast('Order status updated');
    }catch(err){ console.error(err); toast('Status update failed: '+(err.message||err.code||'unknown error')); sel.value = prevValue; }
  }
});

/* =========================================================
   COUPON APPLY
========================================================= */
async function handleApplyCoupon(){
  const input = document.getElementById('coupon-input');
  const code = (input.value||'').trim().toUpperCase();
  if(!code) return;
  try{
    const snap = await getDoc(doc(db,'coupons',code));
    if(!snap.exists()){ toast('Invalid coupon code'); return; }
    const c = {id:snap.id, ...snap.data()};
    if(!c.active){ toast('Coupon is inactive'); return; }
    if((c.usedCount||0) >= c.maxUses){ toast('Coupon usage limit reached'); return; }
    state.appliedCoupon = c;
    toast('Coupon applied!');
    render();
  }catch(err){ console.error(err); toast('Could not verify coupon'); }
}

/* =========================================================
   FORM SUBMITS
========================================================= */
document.addEventListener('submit', async (e)=>{
  const form = e.target;

  /* ---- Admin login ---- */
  if(form.dataset.form==='admin-login'){
    e.preventDefault();
    const pass = form.password.value;
    if(pass === ADMIN_PASSWORD){
      state.isAdmin = true;
      sessionStorage.setItem('sw_admin','1');
      document.getElementById('modal-root').innerHTML='';
      listenAllOrders(); listenCoupons();
      location.hash = '#/admin';
    } else {
      document.getElementById('admin-login-error').textContent = 'Galat password.';
    }
    return;
  }

  /* ---- Purchase ---- */
  if(form.dataset.form==='purchase'){
    e.preventDefault();
    const fd = new FormData(form);
    const phone = fd.get('phone');
    if(!/^\d{10}$/.test(phone)){ toast('Phone number 10 digit hona chahiye'); return; }
    const studentDetails = {
      name: fd.get('name'), branch: fd.get('branch'), className: fd.get('className'),
      batch: fd.get('batch'), phone, email: fd.get('email'),
    };
    const items = Object.keys(state.cart).map(id=>({p: state.products.find(x=>x.id===id), qty: state.cart[id]})).filter(x=>x.p);
    const subtotal = cartTotal();
    const discAmt = state.appliedCoupon ? computeDiscount(state.appliedCoupon, subtotal) : 0;
    const final = Math.max(0, subtotal - discAmt);
    const paymentMethod = form.pay.value;
    if(paymentMethod === 'UPI' && !state.appliedCoupon){
      toast('UPI se pay karne ke liye pehle ek valid coupon apply karo');
      return;
    }
    const outOfStockItem = items.find(({p,qty})=> !inStock(p) || (p.quantity!=null && qty>p.quantity));
    if(outOfStockItem){
      toast(`${outOfStockItem.p.name} ab available nahi hai ya itni quantity nahi bachi. Cart update kar lo.`);
      delete state.cart[outOfStockItem.p.id]; saveCart(); render();
      return;
    }
    const btn = form.querySelector('button[type=submit]');
    btn.textContent = 'Processing...'; btn.disabled = true;
    try{
      for(const {p,qty} of items){
        await addDoc(collection(db,'orders'), {
          type:'purchase', uid: state.uid,
          productId: p.id, productName: p.name, productImage: (p.images&&p.images[0])||'',
          mrp: p.mrp, price: p.price*qty, qty,
          ...studentDetails,
          couponCode: state.appliedCoupon ? state.appliedCoupon.id : null,
          discountAmount: items.length ? Math.round(discAmt/items.length) : 0,
          finalPrice: items.length===1 ? final : Math.round((p.price*qty) - (discAmt * (p.price*qty/subtotal))),
          paymentMethod, status:'pending', createdAt: serverTimestamp(),
        });
        if(p.quantity!=null){
          await updateDoc(doc(db,'products', p.id), {quantity: increment(-qty)});
        }
      }
      if(state.appliedCoupon){
        await updateDoc(doc(db,'coupons', state.appliedCoupon.id), {usedCount: increment(1)});
      }
      state.cart = {}; saveCart(); state.appliedCoupon=null;
      document.getElementById('checkout-detail').innerHTML = renderSuccessBox('purchase');
    }catch(err){ console.error(err); toast('Order failed, try again'); btn.disabled=false; btn.textContent='Confirm Purchase'; }
    return;
  }

  /* ---- Registration ---- */
  if(form.dataset.form==='registration'){
    e.preventDefault();
    const fd = new FormData(form);
    const phone = fd.get('phone');
    if(!/^\d{10}$/.test(phone)){ toast('Phone number 10 digit hona chahiye'); return; }
    const items = Object.keys(state.cart).map(id=>({p: state.products.find(x=>x.id===id), qty: state.cart[id]})).filter(x=>x.p);
    const btn = form.querySelector('button[type=submit]');
    btn.textContent='Submitting...'; btn.disabled=true;
    try{
      for(const {p} of items){
        await addDoc(collection(db,'orders'), {
          type:'registration', uid: state.uid,
          productId: p.id, productName: p.name,
          name: fd.get('name'), branch: fd.get('branch'), className: fd.get('className'),
          batch: fd.get('batch'), phone, email: fd.get('email'),
          createdAt: serverTimestamp(),
        });
      }
      state.cart = {}; saveCart();
      document.getElementById('checkout-detail').innerHTML = renderSuccessBox('registration');
    }catch(err){ console.error(err); toast('Registration failed, try again'); btn.disabled=false; btn.textContent='Submit Registration'; }
    return;
  }

  /* ---- Admin: category form ---- */
  if(form.dataset.form==='category-form'){
    e.preventDefault();
    const fd = new FormData(form);
    const data = { symbol: fd.get('symbol').toUpperCase(), name: fd.get('name'), color: fd.get('color'), order: Number(fd.get('order'))||0 };
    const id = form.dataset.id;
    try{
      if(id) await updateDoc(doc(db,'categories',id), data);
      else await addDoc(collection(db,'categories'), data);
      document.getElementById('modal-root').innerHTML='';
      toast('Category saved');
    }catch(err){ console.error(err); toast('Failed to save category: '+(err.message||err.code||'unknown error')); }
    return;
  }

  /* ---- Admin: product form ---- */
  if(form.dataset.form==='product-form'){
    e.preventDefault();
    const fd = new FormData(form);
    const files = form.images.files;
    const id = form.dataset.id;
    const msgEl = document.getElementById('product-form-msg');

    if(files.length>0 && (files.length<5 || files.length>15)){
      msgEl.style.color='var(--red)'; msgEl.textContent='Minimum 5 aur maximum 15 images upload karo.'; return;
    }
    if(!id && files.length===0){
      msgEl.style.color='var(--red)'; msgEl.textContent='Kam se kam 5 images upload karo.'; return;
    }

    const btn = form.querySelector('button[type=submit]');
    btn.disabled=true; msgEl.style.color='var(--ink-soft)'; msgEl.textContent='Saving...';

    try{
      let imageUrls = null;
      if(files.length>0){
        imageUrls = [];
        for(let i=0;i<files.length;i++){
          msgEl.textContent = `Processing image ${i+1} of ${files.length}...`;
          const dataUrl = await fileToCompressedDataUrl(files[i]);
          imageUrls.push(dataUrl);
        }
      }
      const qtyVal = fd.get('quantity');
      const data = {
        categoryId: fd.get('categoryId'), name: fd.get('name'),
        mrp: Number(fd.get('mrp')), price: Number(fd.get('price')),
        quantity: (qtyVal===''||qtyVal===null) ? null : Number(qtyVal),
        badge: fd.get('badge')||null, longDescription: fd.get('longDescription'),
      };
      if(imageUrls) data.images = imageUrls;

      if(id) await updateDoc(doc(db,'products',id), data);
      else await addDoc(collection(db,'products'), data);

      document.getElementById('modal-root').innerHTML='';
      toast('Product saved');
    }catch(err){ console.error(err); msgEl.style.color='var(--red)'; msgEl.textContent='Upload failed: '+err.message; btn.disabled=false; }
    return;
  }

  /* ---- Admin: coupon form ---- */
  if(form.dataset.form==='coupon-form'){
    e.preventDefault();
    const fd = new FormData(form);
    const code = fd.get('code').trim().toUpperCase();
    try{
      await setDoc(doc(db,'coupons',code), {
        type: fd.get('type'), value: Number(fd.get('value')), maxUses: Number(fd.get('maxUses')),
        usedCount:0, active:true,
      });
      document.getElementById('modal-root').innerHTML='';
      toast('Coupon created');
    }catch(err){ console.error(err); toast('Failed to create coupon: '+(err.message||err.code||'unknown error')); }
    return;
  }
});

/* ---- search input ---- */
document.addEventListener('input', (e)=>{
  if(e.target.id==='search-input'){ state.searchQuery = e.target.value; render(); document.getElementById('search-input').focus(); }
});

function renderSuccessBox(type){
  if(type==='purchase'){
    return `<div class="success-box">
      <div class="success-icon">✓</div>
      <h2 class="disp">Order placed successfully!</h2>
      <p style="color:var(--ink-soft); font-size:13px;">📞 Coaching contact: <a href="tel:${COACHING_PHONE}" style="color:var(--green); font-weight:600;">${COACHING_PHONE}</a></p>
      <p style="color:var(--ink-soft); font-size:13px;">🏢 Visit institute for delivery.</p>
      <a href="#/orders" class="btn btn-navy">View My Orders</a>
    </div>`;
  }
  return `<div class="success-box">
    <div class="success-icon">✓</div>
    <h2 class="disp">Successfully registered!</h2>
    <p style="color:var(--ink-soft); font-size:13px;">Contact institute for more.</p>
    <p style="color:var(--ink-soft); font-size:13px;">📞 <a href="tel:${COACHING_PHONE}" style="color:var(--green); font-weight:600;">${COACHING_PHONE}</a></p>
    <a href="#/" class="btn btn-navy">Back to Shop</a>
  </div>`;
}

/* initial render (in case data arrives late) */
render();
</script>
